[package]
name = "heliora-zk-verifier"
version = "0.1.0"
edition = "2021"
description = "On-chain Groth16 verifier for Heliora's Circom age-eligibility proofs (BN254)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "25.0.0" }

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
